[uwsgi]
master = true
env = PROMETHEUS_MULTIPROC_DIR=/tmp/promdb-argus-metrics
lazy-apps = true
enable-threads = true
socket = /var/lib/argus/argus.sock
umask = 0007
wsgi-file = argus_backend.py
callable = argus_app
manage-script-name = true
single-interpreter = true
mount = /=argus_backend:argus_app
processes = 4
threads = 100
buffer-size = 48000
listen = 1024
max-worker-lifetime = 86400
max-requests = 65535
stats = /var/lib/argus/argus-stats.sock
# Shutdown optimization: Reduce worker shutdown time from 60s default to 5s
worker-reload-mercy = 5
# Overall reload/shutdown mercy time
reload-mercy = 5
# Die gracefully on SIGTERM instead of brutal reload
die-on-term = true
